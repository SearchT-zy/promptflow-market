# PromptFlow 一键自部署（PRD 8.4 开源版形态）
# 用法：docker compose up -d --build → http://localhost:8080
# 开源模式：MARKETPLACE_ENABLED=false（仅模板库 + 编辑器 + 导出）
services:
  api:
    build: ./backend
    environment:
      - DATABASE_URL=sqlite:////app/data/promptflow.db
      - MARKETPLACE_ENABLED=${MARKETPLACE_ENABLED:-false}
      - PUBLIC_BASE_URL=http://localhost:8080
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
    volumes:
      - promptflow-data:/app/data
    restart: unless-stopped

  web:
    image: node:22-slim
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "npm install --registry=https://registry.npmmirror.com && npm run build"
    restart: "no"

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - web
    restart: unless-stopped

volumes:
  promptflow-data:
